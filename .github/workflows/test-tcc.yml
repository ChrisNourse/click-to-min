name: Test TCC Accessibility Grant

on:
  push:
    branches: [test/tcc-grant]

jobs:
  test-tcc:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./build.sh

      - name: Install cliclick
        run: brew install cliclick

      - name: Grant TCC permissions to all binaries
        run: |
          BINARY_PATH="$(pwd)/ClickToMin.app/Contents/MacOS/ClickToMin"
          swift build -c release --package-path qa/harness/AXProbe
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/axprobe"
          CLICLICK="$(which cliclick)"
          TCC_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          grant_tcc() {
            local bin="$1"
            local service="$2"
            # Get csreq blob for the binary
            codesign -dr - "$bin" 2>&1 | awk -F ' => ' '/designated/{print $2}' | csreq -r- -b /tmp/csreq.bin
            local CSREQ_HEX=$(xxd -p /tmp/csreq.bin | tr -d '\n')
            sudo sqlite3 "$TCC_DB" \
              "INSERT OR REPLACE INTO access VALUES('$service','$bin',1,2,3,1,X'$CSREQ_HEX',NULL,0,'UNUSED',NULL,NULL,$(date +%s));" \
              && echo "  $service -> $(basename "$bin") OK" \
              || echo "  $service -> $(basename "$bin") FAILED"
          }

          echo "ClickToMin: $BINARY_PATH"
          echo "AXProbe:    $AXPROBE"
          echo "cliclick:   $CLICLICK"
          echo ""
          for SERVICE in kTCCServiceAccessibility kTCCServiceListenEvent kTCCServicePostEvent; do
            for BIN in "$BINARY_PATH" "$AXPROBE" "$CLICLICK"; do
              grant_tcc "$BIN" "$SERVICE"
            done
          done
          echo ""
          echo "=== Verify grants ==="
          sudo sqlite3 "$TCC_DB" "SELECT service, client FROM access WHERE auth_value=2;"

      - name: Launch ClickToMin and verify
        run: |
          sleep 2
          open ClickToMin.app
          sleep 5
          pgrep -l ClickToMin || echo "Not running"
          echo "=== ClickToMin lifecycle logs ==="
          log show --last 8s --predicate 'subsystem == "com.click-to-min"' --style syslog 2>/dev/null | tail -15 || true

      - name: Verify AX is-trusted
        run: |
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/axprobe"
          "$AXPROBE" is-trusted && echo "AX TRUSTED" || echo "AX NOT TRUSTED (exit $?)"

      - name: Quick minimize test (bypass full suite)
        timeout-minutes: 1
        run: |
          swift build -c release --package-path qa/harness/AXProbe 2>&1 | tail -3
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/axprobe"
          ls -la "$AXPROBE" || { echo "axprobe not at expected path, searching..."; AXPROBE="$(find . -path '*/AXProbe/.build/*/release/axprobe' -type f | head -1)"; }
          echo "Using: $AXPROBE"
          # Use TextEdit instead of Safari to avoid first-run dialogs
          open -a TextEdit
          sleep 2
          # Get Dock tile frame for TextEdit
          FRAME=$("$AXPROBE" dock-item-frame com.apple.TextEdit 2>&1) && echo "Dock frame: $FRAME" || { echo "dock-item-frame FAILED: $FRAME"; exit 1; }
          eval "$FRAME"
          CX=$(awk -v x="$x" -v w="$w" 'BEGIN{printf "%d", x + w/2}')
          CY=$(awk -v y="$y" -v h="$h" 'BEGIN{printf "%d", y + h/2}')
          echo "Click target: ($CX, $CY)"
          # Make TextEdit frontmost
          osascript -e 'tell application "TextEdit" to activate'
          sleep 1
          FM=$("$AXPROBE" frontmost-bundle-id)
          echo "Frontmost before click: $FM"
          # Click Dock tile — should trigger ClickToMin minimize
          cliclick "c:$CX,$CY"
          echo "Click sent, waiting for minimize..."
          if "$AXPROBE" wait-until-minimized com.apple.TextEdit --timeout 3; then
            echo "SUCCESS: Window minimized!"
          else
            echo "FAILED: Window did not minimize within 3s"
            echo "=== ClickToMin logs ==="
            log show --last 15s --predicate 'subsystem == "com.click-to-min"' --style syslog 2>/dev/null | tail -30 || true
            echo "=== Window state ==="
            "$AXPROBE" window-count com.apple.TextEdit 2>&1 || true
            "$AXPROBE" is-minimized com.apple.TextEdit 2>&1 || true
            exit 1
          fi

      - name: Run FULL QA suite (only if quick test passed)
        run: |
          ./qa/suites/run-all.sh 2>&1 || echo "QA exit code: $?"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa/reports
