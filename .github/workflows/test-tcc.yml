name: Test TCC Accessibility Grant

on:
  push:
    branches: [test/tcc-grant]

jobs:
  test-tcc:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./build.sh

      - name: Build AXProbe
        run: swift build -c release --package-path qa/harness/AXProbe

      - name: Grant TCC permissions
        run: |
          BINARY_PATH="$(pwd)/ClickToMin.app/Contents/MacOS/ClickToMin"
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/axprobe"
          TCC_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          grant_tcc() {
            local bin="$1" service="$2"
            codesign -dr - "$bin" 2>&1 | awk -F ' => ' '/designated/{print $2}' | csreq -r- -b /tmp/csreq.bin
            local CSREQ_HEX=$(xxd -p /tmp/csreq.bin | tr -d '\n')
            sudo sqlite3 "$TCC_DB" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, indirect_object_identifier_type, indirect_object_identifier) VALUES ('$service','$bin',1,2,3,1,X'$CSREQ_HEX',0,'UNUSED');" \
              && echo "  $service -> $(basename "$bin") OK" \
              || echo "  $service -> $(basename "$bin") FAILED"
          }

          for SERVICE in kTCCServiceAccessibility kTCCServiceListenEvent kTCCServicePostEvent kTCCServiceScreenCapture; do
            for BIN in "$BINARY_PATH" "$AXPROBE"; do
              grant_tcc "$BIN" "$SERVICE"
            done
          done

      - name: Test --test-click pipeline
        timeout-minutes: 1
        run: |
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/axprobe"
          # Launch TextEdit as target
          open -a TextEdit
          sleep 2
          # Get Dock tile center
          FRAME=$("$AXPROBE" dock-item-frame com.apple.TextEdit 2>&1)
          echo "Dock frame: $FRAME"
          eval "$FRAME"
          CX=$(awk -v x="$x" -v w="$w" 'BEGIN{printf "%d", x + w/2}')
          CY=$(awk -v y="$y" -v h="$h" 'BEGIN{printf "%d", y + h/2}')
          echo "Click target: ($CX, $CY)"
          # Make TextEdit frontmost
          osascript -e 'tell application "TextEdit" to activate'
          sleep 1
          echo "Frontmost: $("$AXPROBE" frontmost-bundle-id)"
          # Launch ClickToMin with --test-click
          open ClickToMin.app --args --test-click "$CX,$CY"
          echo "Launched ClickToMin with --test-click $CX,$CY"
          # Wait for minimize (1s app delay + processing)
          if "$AXPROBE" wait-until-minimized com.apple.TextEdit --timeout 5; then
            echo "SUCCESS: Window minimized via --test-click!"
          else
            echo "FAILED: Window did not minimize within 5s"
            echo "=== ClickToMin process logs ==="
            log show --last 10s --predicate 'process == "ClickToMin"' --style syslog 2>/dev/null | tail -30 || true
            echo "=== Window state ==="
            "$AXPROBE" window-count com.apple.TextEdit 2>&1 || true
            "$AXPROBE" is-minimized com.apple.TextEdit 2>&1 || true
            exit 1
          fi
