name: Test TCC Accessibility Grant

on:
  push:
    branches: [test/tcc-grant]

jobs:
  test-tcc:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./build.sh

      - name: Show TCC DB structure
        run: |
          echo "=== TCC DB schema ==="
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" ".schema access" || echo "Cannot read TCC.db without sudo"
          echo ""
          echo "=== Trying with sudo ==="
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" ".schema access" || echo "sudo also failed"

      - name: Grant Accessibility to built binary
        run: |
          BINARY_PATH="$(pwd)/ClickToMin.app/Contents/MacOS/ClickToMin"
          echo "Binary: $BINARY_PATH"
          echo ""
          echo "=== Attempting TCC insert (kTCCServiceAccessibility) ==="
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceAccessibility', '$BINARY_PATH', 1, 2, 3, 1);" \
            && echo "INSERT succeeded" || echo "INSERT failed"
          echo ""
          echo "=== Verifying grant ==="
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT * FROM access WHERE service='kTCCServiceAccessibility';"

      - name: Also grant to AXProbe
        run: |
          swift build -c release --package-path qa/harness/AXProbe
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/AXProbe"
          echo "AXProbe: $AXPROBE"
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceAccessibility', '$AXPROBE', 1, 2, 3, 1);" \
            && echo "INSERT succeeded" || echo "INSERT failed"

      - name: Test AX access (launch app + probe)
        run: |
          echo "=== Launching ClickToMin ==="
          open ClickToMin.app
          sleep 3
          echo "=== Checking if running ==="
          pgrep -l ClickToMin || echo "Not running"
          echo ""
          echo "=== Testing AXProbe ==="
          AXPROBE="$(swift build -c release --package-path qa/harness/AXProbe --show-bin-path)/AXProbe"
          "$AXPROBE" --pid "$(pgrep ClickToMin)" 2>&1 || echo "AXProbe exit code: $?"

      - name: Run QA smoke (full mode attempt)
        run: |
          ./qa/suites/run-all.sh --ci 2>&1 || echo "QA exit code: $?"
