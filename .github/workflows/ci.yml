name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    # Runner pin: macos-14 (Sonoma, arm64). Do not use macos-latest — toolchain
    # drift silently breaks builds. Re-pin deliberately when upgrading.
    runs-on: macos-14
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: "spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}"
          restore-keys: |
            spm-${{ runner.os }}-

      # pinned 2026-04-22, Xcode versions on this runner: 15.2, 15.3, 15.4 (source: https://github.com/actions/runner-images)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (debug)
        run: swift build -c debug

      - name: Test (with coverage)
        run: swift test --parallel --enable-code-coverage

      - name: Generate coverage report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST=$(find -L "$BIN_PATH" -name "*.xctest" -type d | head -1)
          BIN="${XCTEST}/Contents/MacOS/$(basename "${XCTEST}" .xctest)"
          PROFDATA=$(find -L "$BIN_PATH/codecov" -name "*.profdata" | head -1)
          # Core-only: IO adapters are thin AX/AppKit wiring, untestable
          # without a live user session. Architecture enforces Core/IO split
          # at compile time — all branching logic lives in Core.
          xcrun llvm-cov export -format=lcov "$BIN" -instr-profile="$PROFDATA" \
            --ignore-filename-regex="(\.build|Tests|Sources/ClickToMin/(IO|AppDelegate|DockWatcher))" \
            > coverage.lcov

      - name: Extract coverage percentage
        id: coverage
        run: |
          LINES_FOUND=$(grep -c '^DA:' coverage.lcov || true)
          LINES_HIT=$(grep '^DA:' coverage.lcov | awk -F, '$2 > 0' | wc -l | tr -d ' ')
          if [ "$LINES_FOUND" -gt 0 ]; then
            PCT=$(( LINES_HIT * 100 / LINES_FOUND ))
          else
            PCT=0
          fi
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: $LINES_HIT / $LINES_FOUND lines = ${PCT}%"

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: "${{ steps.coverage.outputs.percentage }}%"
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 100

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/**/TestResults

  bundle-check:
    needs: build-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: "spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}"
          restore-keys: |
            spm-${{ runner.os }}-

      # pinned 2026-04-22, Xcode versions on this runner: 15.2, 15.3, 15.4 (source: https://github.com/actions/runner-images)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./build.sh

      - name: Verify codesign
        run: codesign --verify --verbose ClickToMin.app

      - name: Lint Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickToMin.app
          path: ClickToMin.app
          retention-days: 7

  qa-smoke:
    needs: bundle-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: "spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}"
          restore-keys: |
            spm-${{ runner.os }}-

      # pinned 2026-04-22, Xcode versions on this runner: 15.2, 15.3, 15.4 (source: https://github.com/actions/runner-images)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build AXProbe harness
        run: swift build -c release --package-path qa/harness/AXProbe

      - name: Test AXProbe harness
        run: swift test --package-path qa/harness/AXProbe

      - name: Run CI-safe QA subset
        run: ./qa/suites/run-all.sh --ci

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa/reports

  qa-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if full QA report required
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from datetime import datetime, timezone

          SOURCE_PATHS = ["Sources/", "Package.swift", "build.sh"]
          TEST_PATHS = ["qa/suites/", "qa/lib/"]

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, head],
              text=True
          ).strip().splitlines()

          source_changed = [f for f in changed if any(f.startswith(p) for p in SOURCE_PATHS)]
          test_changed = [f for f in changed if any(f.startswith(p) for p in TEST_PATHS)]

          if not source_changed and not test_changed:
              print("No source or test changes — QA gate skipped")
              sys.exit(0)

          try:
              with open("qa/metrics/history.jsonl") as f:
                  lines = [json.loads(l) for l in f if l.strip()]
          except FileNotFoundError:
              lines = []

          if not lines:
              print("❌ No QA report found (qa/metrics/history.jsonl is empty or missing)")
              print("\nRun the full suite and commit the report:")
              print("  ./qa/run.sh")
              print("  git add qa/reports/ qa/metrics/history.jsonl")
              print("  git commit -m 'chore: qa report'")
              sys.exit(1)

          latest = lines[-1]
          failed = False

          if source_changed:
              print(f"Source files changed ({len(source_changed)}):")
              for f in source_changed[:10]:
                  print(f"  {f}")
              last_source_sha = subprocess.check_output(
                  ["git", "log", "-1", "--format=%h", "--", *SOURCE_PATHS],
                  text=True
              ).strip()
              report_sha = latest.get("git_sha", "")
              print(f"\nLast source commit: {last_source_sha}")
              print(f"Last QA report SHA: {report_sha}")
              if report_sha == last_source_sha:
                  print("✓ Source SHA matches")
              else:
                  print(f"❌ QA report is stale — tested {report_sha} but last source change is {last_source_sha}")
                  failed = True

          if test_changed:
              print(f"\nTest files changed ({len(test_changed)}):")
              for f in test_changed[:10]:
                  print(f"  {f}")
              last_test_ts = subprocess.check_output(
                  ["git", "log", "-1", "--format=%aI", "--", *TEST_PATHS],
                  text=True
              ).strip()
              report_ts = latest.get("ts", "")
              print(f"Last test commit: {last_test_ts}")
              print(f"Last QA report:   {report_ts}")
              if report_ts and last_test_ts:
                  report_dt = datetime.fromisoformat(report_ts.replace("Z", "+00:00"))
                  test_dt = datetime.fromisoformat(last_test_ts)
                  if report_dt >= test_dt:
                      print("✓ Report is newer than last test change")
                  else:
                      print("❌ Report predates test changes — re-run required")
                      failed = True
              else:
                  print("❌ Cannot compare timestamps")
                  failed = True

          if failed:
              print("\nRun the full suite after your changes:")
              print("  ./qa/run.sh")
              print("  git add qa/reports/ qa/metrics/history.jsonl")
              print("  git commit -m 'chore: qa report'")
              sys.exit(1)

          print("\n✓ QA gate passed")
          PY

  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftformat + swiftlint
        run: brew install swiftformat swiftlint

      - name: Format lint
        # Only lint Sources. Tests intentionally use patterns (force
        # unwraps in XCTest helpers, deliberate import ordering to put
        # @testable imports last) that conflict with SwiftFormat defaults.
        run: swiftformat Sources --lint

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml Sources
