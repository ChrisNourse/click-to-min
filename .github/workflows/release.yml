name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    # Runner pin: macos-14 (Sonoma, arm64). Re-pin deliberately when upgrading.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify QA covers this release
        env:
          QA_BADGE_GIST_ID: ${{ vars.QA_BADGE_GIST_ID }}
        run: |
          if [[ -z "${QA_BADGE_GIST_ID:-}" ]]; then
            echo "::error::QA_BADGE_GIST_ID not configured — cannot verify QA status"
            exit 1
          fi
          TAG_SHA="$(git rev-parse --short HEAD)"
          QA_JSON="$(curl -sf "https://gist.githubusercontent.com/raw/${QA_BADGE_GIST_ID}/qa-status.json" || true)"
          if [[ -z "$QA_JSON" ]]; then
            echo "::error::Could not fetch qa-status.json from Gist — has QA ever been run?"
            exit 1
          fi
          QA_SHA="$(echo "$QA_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['tested_sha'])")"
          echo "Tag SHA:    $TAG_SHA"
          echo "QA SHA:     $QA_SHA"
          if [[ "$QA_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Release blocked — QA tested $QA_SHA but releasing $TAG_SHA. Run full QA on this commit first."
            exit 1
          fi
          echo "✓ QA verified for $TAG_SHA"

      # pinned 2026-04-22, Xcode versions on this runner: 15.2, 15.3, 15.4 (source: https://github.com/actions/runner-images)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Import signing cert
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "${P12_BASE64:-}" ]]; then
            echo "::warning::MACOS_SIGNING_P12_BASE64 not set — falling back to ad-hoc signing"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CLICKTOMIN_SIGN_ID=ClickToMin Release Signing" >> "$GITHUB_ENV"

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./build.sh

      - name: Build zip (for Homebrew cask)
        run: |
          ditto -c -k --keepParent ClickToMin.app "ClickToMin-${GITHUB_REF_NAME}.zip"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          mkdir -p dmg-staging
          cp -R ClickToMin.app dmg-staging/
          create-dmg \
            --volname "ClickToMin ${GITHUB_REF_NAME}" \
            --window-pos 200 120 \
            --window-size 540 360 \
            --icon-size 96 \
            --icon "ClickToMin.app" 140 180 \
            --app-drop-link 400 180 \
            --hide-extension "ClickToMin.app" \
            --no-internet-enable \
            "ClickToMin-${GITHUB_REF_NAME}.dmg" \
            dmg-staging/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClickToMin-${{ github.ref_name }}.dmg
            ClickToMin-${{ github.ref_name }}.zip
          body: |
            ## Install (recommended)

            ```
            brew install --cask chrisnourse/clicktomin/click-to-min
            ```

            ## Install (manual)

            1. Download `ClickToMin-${{ github.ref_name }}.dmg` below
            2. Open it, drag **ClickToMin** into **Applications**
            3. Clear quarantine: `xattr -dr com.apple.quarantine /Applications/ClickToMin.app`
            4. Grant Accessibility when prompted (System Settings → Privacy & Security → Accessibility)

  update-cask:
    needs: release
    runs-on: macos-14
    steps:
      - name: Bump cask in tap
        uses: macauley/action-homebrew-bump-cask@v1
        with:
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          tap: ChrisNourse/homebrew-clicktomin
          cask: click-to-min
          tag: ${{ github.ref_name }}
          force: false
