name: QA Attest

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short SHA that passed full QA"
        required: true

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Write qa-status.json to Gist
        env:
          GIST_ID: ${{ vars.QA_BADGE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_SECRET }}
          TESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [[ -z "${GIST_ID:-}" || -z "${GIST_TOKEN:-}" ]]; then
            echo "::error::QA_BADGE_GIST_ID or GIST_SECRET not configured"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          tested_sha = os.environ["TESTED_SHA"]
          qa_status = {
              "schemaVersion": 1,
              "label": "QA",
              "message": f"verified {tested_sha}",
              "color": "brightgreen",
              "tested_sha": tested_sha,
              "tested_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          files = {"qa-status.json": {"content": json.dumps(qa_status)}}
          payload = json.dumps({"files": files}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "clicktomin-qa-attest",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(f"qa-status.json pushed: HTTP {resp.status}")
              print(f"tested_sha={tested_sha}")
          PY
